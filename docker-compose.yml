services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama_init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      until ollama list >/dev/null 2>&1; do sleep 2; done &&
      ollama pull "${ASSISTANT_MODEL}"
    restart: "no"

  app:
    build: .
    depends_on:
      ollama_init:
        condition: service_completed_successfully
    environment:
      ASSISTANT_API_URL: http://ollama:11434/api/chat
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:3b}
      ASSISTANT_CONTEXT_SIZE: "4096"
      ASSISTANT_MAX_TOKENS: "256"
      ASSISTANT_LOCALSCRIPT_CONTEXT_SIZE: "4096"
      ASSISTANT_LOCALSCRIPT_NUM_PREDICT: "256"
      ASSISTANT_BATCH_SIZE: "1"
      ASSISTANT_PROFILE: localscript
      ASSISTANT_API_HOST: 0.0.0.0
      ASSISTANT_API_PORT: "8080"
      ASSISTANT_SHOW_LOGS: "false"
    ports:
      - "8080:8080"

volumes:
  ollama_data:
