openapi: 3.0.3
info:
  title: LocalScript API
  description: Local LocalScript generation and refinement API for the judged contour.
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /generate:
    post:
      summary: Generate or refine LocalScript from a natural-language task
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
                  description: Natural-language task or refinement request.
                allow_clarification:
                  type: boolean
                  default: false
                  description: When true, the API may return a clarification question instead of final code.
                persist_memory:
                  type: boolean
                  default: false
                  description: Persist the request and response in local memory.
                use_memory_context:
                  type: boolean
                  default: false
                  description: Reuse local conversation memory when explicit context_messages are not provided.
                context_messages:
                  type: array
                  description: Optional explicit conversation context for iterative refinement.
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum:
                          - system
                          - user
                          - assistant
                      content:
                        type: string
            example:
              prompt: "Return orderId from workflow context. {\"wf\":{\"vars\":{\"orderId\":\"123\"}}}"
              allow_clarification: false
              context_messages:
                - role: assistant
                  content: "return wf.vars.orderId"
                - role: user
                  content: "Refine it so the answer stays pure judged LocalScript."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - clarification_question
                  - metrics
                properties:
                  code:
                    type: string
                    description: Final generated LocalScript. Empty when a clarification question is returned.
                  clarification_question:
                    type: string
                    nullable: true
                    description: Clarification question returned when more context is required.
                  metrics:
                    type: object
                    additionalProperties: true
                    description: Machine-readable generation and validation metrics.
              example:
                code: "return wf.vars.orderId"
                clarification_question: null
                metrics:
                  selected_strategy: "baseline"
                  validation_errors: 0
                  candidate_count: 1
                  execution_status: "passed"
                  sandbox_status: "passed"
